[project]
name = "kboat"
version = "0.1.0"
description = "Deterministic K-Boat tools over a shared frontmatter core: lifecycle, repos, the daily pick, validation, and the note writer."
# A behavioural floor: from 3.14 `Path.exists()` is `os.path.exists` and swallows
# every `OSError`. `kboat.note.migrate` rests on that to report a probe it cannot
# make as a row rather than aborting the scan.
requires-python = ">=3.14"
# Intentionally zero runtime dependencies: the mechanical core stays a pure,
# independently-testable package. The browser-driven NotebookLM CLI lives outside
# this env as a mise tool (`pipx:notebooklm-py`), so it never leaks in here.
dependencies = []

[project.scripts]
kboat-lifecycle = "kboat.lifecycle.__main__:main"
kboat-repos = "kboat.repos.__main__:main"
kboat-pick = "kboat.pick.__main__:main"
kboat-note = "kboat.note.__main__:main"
kboat-validate = "kboat.validate.__main__:main"
kboat-doctor = "kboat.doctor.__main__:main"
kboat-bookmarklet = "kboat.bookmarklet.__main__:main"
kboat-queue = "kboat.queue.__main__:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kboat"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=kboat --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=80"
# Promote ResourceWarning to error so a leaked file handle fails loudly
# instead of surfacing as a cryptic GC-time warning during collection.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ty.environment]
root = ["src", "tests"]

[tool.coverage.run]
source = ["src/kboat"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    # Anchored to a bare ellipsis *body*. Unanchored it matched any line with
    # three dots — every `tuple[str, ...]` annotation — and a match on a `def`
    # clause excludes the whole function, so the gate reported a pass over
    # code it had never measured.
    "^\\s*\\.\\.\\.$",
    "if __name__ == \"__main__\":",
]
