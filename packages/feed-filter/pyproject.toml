[project]
name = "feed-filter"
version = "0.1.0"
description = "Filter new feed/scrape pages by prompt and file survivors into the Obsidian vault"
requires-python = ">=3.13"
# Floors = the versions under test (locked in uv.lock); a floor-less spec lets a
# source/lock-less install resolve an untested-old release. No upper caps: uv.lock
# pins exact versions, so an unreviewed major can land only via a deliberate
# `uv lock --upgrade`, where it is reviewed — a cap would just add churn-y bumps.
dependencies = [
    "httpx>=0.28",
    # OS trust store TLS verification; see fetch.build_client for the why.
    "truststore>=0.10",
    "feedparser>=6.0.13",
    "selectolax>=0.4.10",
    "tomlkit>=0.15",
    # The shared note core: feed-filter writes Feeds/ notes through kboat.write /
    # kboat.schema rather than reimplementing frontmatter serialization. Resolved
    # from the workspace (see [tool.uv.sources]); kboat itself stays zero-dependency.
    "kboat",
]

[project.optional-dependencies]
# Opt-in browser ingestion path for JS-rendered / anti-bot sites.
# Not installed by default: the httpx-readable sites pay nothing. Enable with
#   uv sync --extra browser && uv run playwright install chromium
# (the second step pulls a ~200 MB Chromium binary, not managed by uv).
browser = ["playwright"]

[project.scripts]
feed-filter = "feed_filter.__main__:main"

[tool.uv.sources]
kboat = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feed_filter"]

[tool.ty.environment]
# ``tests`` is a root so cross-test-module imports (e.g. ``import _fake_playwright``)
# resolve the same way pytest's prepend import mode resolves them at runtime — the
# test dir is on ``sys.path``, so sibling helpers import by bare name.
root = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=feed_filter --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=80"
# Promote ResourceWarning to error so leaked sqlite/file handles fail loudly
# instead of surfacing as cryptic GC-time warnings during collection.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["src/feed_filter"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    # Anchored to a bare ellipsis *body*. Unanchored it matched any line with
    # three dots — every `tuple[str, ...]` annotation — and a match on a `def`
    # clause excludes the whole function, so the gate reported a pass over
    # code it had never measured.
    "^\\s*\\.\\.\\.$",
    # The entrypoint guard is unreachable under pytest. Not-yet-implemented
    # dispatch arms use an explicit `# pragma: no cover` at the call site —
    # deliberately NOT a blanket `raise NotImplementedError` exclude, so a
    # stub accidentally shipped without a pragma still dents coverage.
    "if __name__ == \"__main__\":",
]
