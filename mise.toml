[tools]
lychee = "latest"
rumdl = "latest"

[env]
OBSIDIAN_VAULT_PATH = "~/Documents/K-Boat"
# Where distilled concept notes live (a Basic Memory project root).
# Defaults to a subdir of the vault; .env overrides it (for K-Boat, a Git-managed directory).
KBOAT_KNOWLEDGE_PATH = "~/Documents/K-Boat/Knowledge"
_.file = ".env"
_.python.venv = { path = ".venv", create = true } # Automatically activate the venv

[tasks.setup]
description = "Sync dependencies from pyproject.toml and install Chromium"
run = [
  "uv sync",
  "playwright install chromium",
  "mise generate git-pre-commit --write --task=pre-commit",
]

[tasks."fmt:md"]
description = "Format markdown files"
run = "rumdl check --fix"

# Not in `qa:*`: full-repo external link check is too slow / network-bound for pre-commit.
[tasks."check:links"]
description = "Check links in the repo"
run = "lychee -v ."

[tasks."nblm:login"]
description = "Log in to NotebookLM with a Google account"
run = "notebooklm login"

[tasks."nblm:auth:check"]
description = "Check the authentication status"
run = "notebooklm auth check --test --json"

[tasks.pre-commit]
description = "Run all pre-commit checks"
depends = ["qa:*"]

[tasks."qa:md"]
description = "Lint markdown files"
run = "rumdl check"

# Python format/QA: one task per package, plus a wildcard aggregator each.
# `pre-commit` (depends = ["qa:*"]) picks up every qa:py:<pkg> directly; `qa:py`
# is the manual all-packages shortcut.

[tasks."fmt:py"]
description = "Autofix Python lint and formatting for all packages"
depends = ["fmt:py:*"]

[tasks."fmt:py:kboat-lifecycle"]
description = "Autofix lint and formatting for the kboat-lifecycle package"
dir = "{{config_root}}/kboat-lifecycle"
run = """
uv run ruff check --fix
uv run ruff format
"""

[tasks."fmt:py:kboat-repos"]
description = "Autofix lint and formatting for the kboat-repos package"
dir = "{{config_root}}/kboat-repos"
run = """
uv run ruff check --fix
uv run ruff format
"""

[tasks."qa:py"]
description = "Lint, type-check, and test all Python packages"
depends = ["qa:py:*"]

[tasks."qa:py:kboat-lifecycle"]
description = "Lint, type-check, and test the kboat-lifecycle package"
dir = "{{config_root}}/kboat-lifecycle"
run = """
uv run ruff check
uv run ruff format --check
uv run ty check
uv run pytest
"""

[tasks."qa:py:kboat-repos"]
description = "Lint, type-check, and test the kboat-repos package"
dir = "{{config_root}}/kboat-repos"
run = """
uv run ruff check
uv run ruff format --check
uv run ty check
uv run pytest
"""
