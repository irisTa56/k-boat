[tools]
rumdl = "latest"

[env]
OBSIDIAN_VAULT_PATH = "~/Documents/K-Boat"
_.file = ".env"
# Automatically activate the venv (uv is provided by Homebrew)
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Sync dependencies from pyproject.toml and install Chromium"
run = [
  "uv sync",
  "playwright install chromium",
  "mise generate git-pre-commit --write --task=pre-commit",
]

[tasks."fmt:md"]
description = "Format markdown files"
run = "rumdl check --fix"

[tasks."nblm:login"]
description = "Log in to NotebookLM with a Google account"
run = "notebooklm login"

[tasks."nblm:auth:check"]
description = "Check the authentication status"
run = "notebooklm auth check --test --json"

[tasks.pre-commit]
description = "Run all pre-commit checks"
depends = ["qa:*"]

[tasks."qa:md"]
description = "Lint markdown files"
run = "rumdl check"
