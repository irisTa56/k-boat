[tools]
gitleaks = "latest"
lychee = "latest"
rumdl = "latest"
uv = "latest"
# The browser-driven NotebookLM CLI, isolated from the project venv (uvx-backed).
# Keeps the `kboat` package zero-dependency; auth lives in ~/.notebooklm, Chromium
# in Playwright's cache, both outside this env. `notebooklm login` installs Chromium
# on first run, so no explicit playwright step is needed.
"pipx:notebooklm-py" = { version = "0.7.2", extras = "browser" }

[env]
OBSIDIAN_VAULT_PATH = "~/Documents/K-Boat"
# Where distilled concept notes live (a Basic Memory project root).
# Defaults to a subdir of the vault; .env overrides it (for K-Boat, a Git-managed directory).
KBOAT_KNOWLEDGE_PATH = "~/Documents/K-Boat/Knowledge"
_.file = ".env"
# One workspace venv at the root: `uv sync` installs every workspace member
# editable plus the shared dev tooling, so each package's console scripts are
# callable bare.
_.python.venv = { path = ".venv", create = true }

[hooks]
postinstall = """
uv sync
mise generate git-pre-commit --write --task=pre-commit
"""

[tasks."fmt:md"]
description = "Format markdown files"
run = "rumdl check --fix"

# Not in `qa:*`: full-repo external link check is too slow / network-bound for pre-commit.
# `--hidden`: without it lychee skips every dotdir, including `.claude/skills` --
# the actual product content, and the one place most likely to accumulate a
# stale relative link. `.gitignore`d paths (e.g. `.venv/`) stay excluded either
# way -- a directory target makes lychee walk it through the same
# gitignore-aware walker as `git status`, unlike a `**` glob target, which does not.
[tasks."check:links"]
description = "Check links in the repo"
run = "lychee -v --hidden ."

# In `qa:*` (unlike `check:links` above): offline-only, so it stays fast and
# network-independent enough to gate every commit -- mirrors CI's
# `link-check-offline` job so a broken relative link is caught locally, not
# only in CI. Same scope as `check:links` (see its comment for `--hidden`).
[tasks."qa:links:offline"]
description = "Check markdown links offline (no network)"
run = "lychee --offline --no-progress --hidden ."

[tasks."nblm:login"]
description = "Log in to NotebookLM with a Google account"
run = "notebooklm login"

[tasks."nblm:auth:check"]
description = "Check the authentication status"
run = "notebooklm auth check --test --json"

[tasks.pre-commit]
description = "Run all pre-commit checks"
depends = ["qa:*"]

[tasks."qa:md"]
description = "Lint markdown files"
run = "rumdl check"

[tasks."qa:secrets"]
description = "Scan staged changes for secrets"
run = "gitleaks git --staged -v"

# Python QA is per-member: each `qa:py:<member>` runs in its own dir so that
# package's pyproject config applies (ruff selects, ty root, pytest coverage),
# resolving against the single workspace venv. `qa:py`/`fmt:py` aggregate them by
# glob, so adding a package means adding its two leaf tasks — no central list.

[tasks."qa:py:kboat"]
description = "Lint, type-check, and test the kboat package"
dir = "packages/kboat"
run = """
uv run ruff check
uv run ruff format --check
uv run ty check
uv run pytest
uv run python ../../scripts/coverage_floor.py coverage.json
"""

[tasks."qa:py:feed-filter"]
description = "Lint, type-check, and test the feed-filter package"
dir = "packages/feed-filter"
run = """
uv run ruff check
uv run ruff format --check
uv run ty check
uv run pytest
uv run python ../../scripts/coverage_floor.py coverage.json
"""

# `scripts/` is flat tooling, not a workspace member (no `pyproject.toml` of its
# own, no `--cov-fail-under`) -- but `coverage_floor.py` gates every `qa:py:*`
# run, so it gets the same lint/type/test commands rather than being the one
# ungated piece of the gate.
[tasks."qa:py:scripts"]
description = "Lint, type-check, and test the coverage-floor script"
run = """
uv run ruff check scripts
uv run ruff format --check scripts
uv run ty check scripts
uv run pytest scripts/tests
"""

[tasks."qa:py"]
description = "Python QA across all packages"
depends = ["qa:py:*"]

[tasks."fmt:py:kboat"]
description = "Autofix kboat lint and formatting"
dir = "packages/kboat"
run = """
uv run ruff check --fix
uv run ruff format
"""

[tasks."fmt:py:feed-filter"]
description = "Autofix feed-filter lint and formatting"
dir = "packages/feed-filter"
run = """
uv run ruff check --fix
uv run ruff format
"""

[tasks."fmt:py:scripts"]
description = "Autofix coverage-floor script lint and formatting"
run = """
uv run ruff check --fix scripts
uv run ruff format scripts
"""

[tasks."fmt:py"]
description = "Autofix lint and formatting across all packages"
depends = ["fmt:py:*"]
