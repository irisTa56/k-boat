[settings]
# Put the workspace venv and the mise tools at the front of PATH rather than
# wherever the inherited PATH happens to place mise's shims dir. Without this
# a bare `python3` resolves to macOS's system Python in a `mise env` shell.
activate_aggressive = true

[tools]
lychee = "latest"
rumdl = "latest"
shellcheck = "latest"
shfmt = "latest"
uv = "latest"

[env]
OBSIDIAN_VAULT_PATH = "~/Documents/K-Boat"
# Where distilled concept notes live (a Basic Memory project root).
# Defaults to a subdir of the vault; .env overrides it (for K-Boat, a Git-managed directory).
KBOAT_KNOWLEDGE_PATH = "~/Documents/K-Boat/Knowledge"
_.file = ".env"
# One workspace venv at the root: `uv sync` installs every workspace member
# editable plus the shared dev tooling, so each package's console scripts are
# callable bare.
_.python.venv = { path = ".venv", create = true }
# The NotebookLM CLI's own venv (tools/notebooklm/pyproject.toml says why it has
# one), behind the venv above rather than in front of it, so `python` still
# resolves to the workspace and only `notebooklm` comes from here.
_.path = ["tools/notebooklm/.venv/bin"]

[hooks]
# Keep the git-hook generation first. A failing step aborts the rest (`sh -o
# errexit`) while `mise install` still exits 0, and the hooks are the steps whose
# absence is silent: a missing venv fails the next command loudly, a missing
# pre-commit hook lets every later commit through ungated and a missing pre-push
# hook every push through unscanned. Both syncs reach the network, so neither can
# take their place.
#
# `--no-active` silences uv's warning that `VIRTUAL_ENV` (exported above) is not
# this project's environment, which is the intent and would otherwise be noise on
# the output the paragraph above asks the reader to scan.
#
# The pre-push hook is redirected into place rather than written with `--write`,
# which would move an existing hook aside as `pre-push.old`. Entire owns
# `pre-push` while its trial runs, so the scan goes to `pre-push.pre-entire`,
# which `entire disable` renames back to `pre-push`. Entire calls that file, with
# git's arguments and stdin, only from a hook it wrote while the file existed;
# the block appended below is the one it writes then, so an `entire enable` later
# rewrites the hook to what it already holds.
postinstall = '''
mise generate git-pre-commit --write --task=pre-commit
push_hook="$(git rev-parse --git-path hooks/pre-push)"
if grep -qs 'Entire CLI hooks' "$push_hook"; then
  grep -qs 'pre-push.pre-entire' "$push_hook" || printf '%s\n' \
    '# Chain: run pre-existing hook' \
    '_entire_hook_dir="$(dirname "$0")"' \
    'if [ -x "$_entire_hook_dir/pre-push.pre-entire" ]; then' \
    '    "$_entire_hook_dir/pre-push.pre-entire" "$@"' \
    'fi' >>"$push_hook"
  push_hook="$push_hook.pre-entire"
fi
mise generate git-pre-commit --hook pre-push --task secrets:push-scan >"$push_hook"
chmod +x "$push_hook"
uv sync
uv sync --project tools/notebooklm --no-active
'''

# `secrets:scan` (per commit, gitleaks), `secrets:push-scan` (per push,
# trufflehog) and `shared-tasks:check` come from dotfiles' shared task library,
# whose `tasks/README.md` is what to read before touching this: why `ref` is a
# full sha on its `main`, and what an include that fails to load takes with it.
# `shared-tasks:check` in CI says when `main` has moved past the pin.
[task_config]
includes = [
  "git::https://github.com/irisTa56/dotfiles.git//tasks?ref=0af676a2e84853068270b9c65252acb39648170f",
]

# Not in `qa:**`: full-repo external link check is too slow / network-bound for pre-commit.
# Shared settings come from `lychee.toml`.
[tasks."check:links"]
description = "Check links in the repo"
run = "lychee -v --config lychee.toml ."

# In `qa:**` (unlike `check:links` above): offline-only, so it stays fast and
# network-independent enough to gate every commit. Same shared settings as
# `check:links`, from the same `lychee.toml`.
[tasks."qa:links:offline"]
description = "Check markdown links offline (no network)"
run = "lychee --offline --no-progress --config lychee.toml ."

[tasks."nblm:login"]
description = "Log in to NotebookLM with a Google account"
run = "notebooklm login"

[tasks."nblm:auth:check"]
description = "Check the authentication status"
run = "notebooklm auth check --test --json"

# `**`, not `*`: mise's `*` matches a single task segment, so `qa:*` left
# `qa:links:offline` ungated. `secrets:scan` is named on its own because it is a
# shared task (see `[task_config]`) and so sits outside `qa:`.
[tasks.pre-commit]
description = "Run all pre-commit checks"
depends = ["qa:**", "secrets:scan"]

# Two commands, because `rumdl` cannot make the second check -- the house rule
# and why a linter cannot see it are `scripts/md_shape.py`'s module docstring.
# That script parses with `markdown-it-py`, so it runs under `uv run` to reach
# the workspace venv rather than whatever `python` the PATH lands on.
[tasks."qa:md"]
description = "Lint markdown files"
run = """
rumdl check
uv run python scripts/md_shape.py
"""

[tasks."fmt:md"]
description = "Format markdown files"
run = "rumdl check --fix"

[tasks."qa:sh"]
description = "Lint and check formatting of shell scripts"
run = """
shellcheck scripts/*.sh
shfmt -i 2 -d scripts/*.sh
"""

[tasks."fmt:sh"]
description = "Autofix shell script formatting"
run = "shfmt -i 2 -w scripts/*.sh"

# Python QA is per-member: each `qa:py:<member>` runs in its own dir so that
# package's pyproject config applies (ruff selects, ty root, pytest coverage),
# resolving against the single workspace venv. `qa:py`/`fmt:py` aggregate them by
# glob, so adding a package means adding its two leaf tasks — no central list.

[tasks."qa:py:kboat"]
description = "Lint, type-check, and test the kboat package"
dir = "packages/kboat"
run = """
uv run ruff check
uv run ruff format --check
uv run ty check
uv run pytest
uv run python ../../scripts/coverage_floor.py coverage.json
"""

[tasks."qa:py:feed-filter"]
description = "Lint, type-check, and test the feed-filter package"
dir = "packages/feed-filter"
run = """
uv run ruff check
uv run ruff format --check
uv run ty check
uv run pytest
uv run python ../../scripts/coverage_floor.py coverage.json
"""

# `scripts/` is flat tooling, not a workspace member (no `pyproject.toml` of its
# own, no `--cov-fail-under`) -- but every script in it gates something (the
# coverage floor, the markdown shape check), so it gets the same lint/type/test
# commands rather than being the one ungated piece of the gate.
[tasks."qa:py:scripts"]
description = "Lint, type-check, and test the scripts/ tooling"
run = """
uv run ruff check scripts
uv run ruff format --check scripts
uv run ty check scripts
uv run pytest scripts/tests
"""

# The NotebookLM CLI's uv project has nothing to lint or test, only a lock. This
# is the one check that fails on that lock going stale: the postinstall hook that
# syncs it cannot fail `mise install`.
[tasks."qa:py:notebooklm"]
description = "Check the NotebookLM CLI's uv.lock matches its pyproject.toml"
run = "uv lock --check --project tools/notebooklm"

[tasks."qa:py"]
description = "Python QA across all packages"
depends = ["qa:py:*"]

[tasks."fmt:py:kboat"]
description = "Autofix kboat lint and formatting"
dir = "packages/kboat"
run = """
uv run ruff check --fix
uv run ruff format
"""

[tasks."fmt:py:feed-filter"]
description = "Autofix feed-filter lint and formatting"
dir = "packages/feed-filter"
run = """
uv run ruff check --fix
uv run ruff format
"""

[tasks."fmt:py:scripts"]
description = "Autofix scripts/ tooling lint and formatting"
run = """
uv run ruff check --fix scripts
uv run ruff format scripts
"""

[tasks."fmt:py"]
description = "Autofix lint and formatting across all packages"
depends = ["fmt:py:*"]
