[tools]
gitleaks = "latest"
lychee = "latest"
rumdl = "latest"
uv = "latest"

[env]
_.file = ".env"

[hooks]
postinstall = "mise generate git-pre-commit --write --task=pre-commit"

[tasks."fmt:md"]
description = "Format markdown files"
run = "rumdl check --fix"

[tasks."fmt:py"]
description = "Auto-fix lint issues and format Python files"
run = [
    "uv run ruff check --fix .",
    "uv run ruff format .",
]

# Not in `qa:*`: full-repo external link check is too slow / network-bound for pre-commit.
[tasks."check:links"]
description = "Check links in the repo"
run = "lychee -v ."

[tasks.pre-commit]
description = "Run all pre-commit checks"
depends = ["qa:*"]

[tasks."qa:md"]
description = "Lint markdown files"
run = "rumdl check"

[tasks."qa:secrets"]
description = "Scan staged changes for secrets"
run = "gitleaks git --staged -v"

[tasks."qa:py:lint"]
description = "Lint Python files"
run = "uv run ruff check ."

[tasks."qa:py:fmt"]
description = "Check Python formatting"
run = "uv run ruff format --check ."

[tasks."qa:py:type"]
description = "Type-check Python sources and tests"
run = "uv run ty check src tests"

[tasks."qa:py:test"]
description = "Run Python unit tests"
run = "uv run pytest -q"
