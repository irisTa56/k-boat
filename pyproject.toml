[project]
name = "k-boat"
version = "0"
requires-python = ">=3.13"
# The workspace root is not itself a package (see [tool.uv] package = false); it
# only aggregates the members so a single `uv sync` builds one environment for the
# whole reading pipeline: `kboat` (the zero-dependency note core + NotebookLM tools)
# and `feed-filter` (the upstream triage funnel, which depends on `kboat`).
dependencies = [
    "kboat",
    "feed-filter",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
kboat = { workspace = true }
feed-filter = { workspace = true }

[dependency-groups]
# Union of both packages' dev tooling, installed once at the workspace root so a
# single `uv sync` covers linting/typing/testing both members. `playwright` is
# dev-only (lets `ty` resolve `playwright.sync_api` and the feed-filter test fake
# shadow it); the runtime browser path stays feed-filter's optional `browser` extra.
dev = [
    "pytest>=9",
    "pytest-cov",
    "ruff>=0.15",
    "ty>=0.0.35,<0.1",
    "playwright",
]
