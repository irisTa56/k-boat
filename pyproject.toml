[project]
name = "k-boat"
version = "0.1.0"
description = "Dump your content into a knowledge lake, then sail it with AI agents."
requires-python = ">=3.13"
dependencies = [
    "notebooklm-py[browser]>=0.6.0",
]

[tool.uv]
# The root is just an environment, not a distributable package;
# the workspace members below are the actual packages.
package = false

[tool.uv.workspace]
members = ["kboat-lifecycle", "kboat-repos"]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.15",
    "ty>=0.0.35",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["kboat_lifecycle", "kboat_repos"]
