# Virtual workspace root: no [project] table, so `uv sync` builds one environment
# from the members under packages/ without installing a root package. Only the
# shared dev tooling lives here; each member declares its own runtime deps.
[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov",
    "ruff>=0.16.0",
    "ty>=0.0.63",
    "playwright",
    # Tests only, never imported by the package: an independent oracle for the
    # frontmatter round-trip. `kboat.frontmatter` is a scanner, not a parser, so
    # asserting a rewritten note against it would let it grade its own homework —
    # output that is no longer YAML re-scans to the same entries.
    "pyyaml",
]

# The one ruff config for every workspace member: same coding style everywhere.
# Members carry no [tool.ruff] of their own — ruff walks up to this. The pytest
# quality bar (branch coverage ≥80, ResourceWarning-as-error) is identical per
# member too; only the coverage target module differs, which pytest can't inherit.
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["kboat", "feed_filter"]
