[project]
name = "kboat"
version = "0.1.0"
description = "Deterministic K-Boat tools over a shared frontmatter core: lifecycle, repos, and the daily pick."
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kboat"

[project.scripts]
kboat-lifecycle = "kboat.lifecycle.__main__:main"
kboat-repos = "kboat.repos.__main__:main"
kboat-pick = "kboat.pick.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
