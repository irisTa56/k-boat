[project]
name = "kboat-repos"
version = "0.1.0"
description = "Deterministic K-Boat repo-catalog helper: canonical slug, status, gh metadata gather and full-catalog refresh."
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kboat_repos"

[project.scripts]
kboat-repos = "kboat_repos.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
