[project]
name = "kboat-lifecycle"
version = "0.1.0"
description = "Deterministic K-Boat distillation lifecycle: stamp the cooldown clock and compute the per-phase work sets."
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kboat_lifecycle"

[project.scripts]
kboat-lifecycle = "kboat_lifecycle.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
