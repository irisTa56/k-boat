# Dependabot version updates. Two ecosystems:
#
# - uv, at the workspace root ("/"): Dependabot reads the root uv.lock, which
#   resolves the whole workspace, so one entry covers every member's runtime deps
#   plus the root dev group — no per-member entry as packages are added.
# - github-actions, at "/": keeps the action versions pinned across the CI
#   workflows (.github/workflows/*.yml) current.
#
# The mise-managed tools (gitleaks, lychee, rumdl, uv) are out of Dependabot's
# scope and stay on `mise upgrade`.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
