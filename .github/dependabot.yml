# Dependabot version updates. No GitHub Actions minutes are consumed: this repo
# has no CI workflows for the update PRs to trigger (relevant if CI is added).
#
# Only the uv ecosystem is configured, at the workspace root ("/"): Dependabot
# reads the root uv.lock, which resolves the whole workspace, so one entry covers
# every member's runtime deps plus the root dev group — no per-member entry as
# packages are added.
# The mise-managed tools (gitleaks, lychee, rumdl, uv) are out of Dependabot's
# scope and stay on `mise upgrade`.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python-deps:
        patterns: ["*"]
