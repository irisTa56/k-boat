# Dependabot version updates. Two ecosystems:
#
# - uv, at the workspace root ("/"): Dependabot reads the root uv.lock, which
#   resolves the whole workspace, so one entry covers every member's runtime deps
#   plus the root dev group — no per-member entry as packages are added.
# - github-actions, at "/": keeps the action versions pinned across the CI
#   workflows (.github/workflows/*.yml) current.
#
# The mise-managed tools are out of Dependabot's scope. gitleaks, lychee, rumdl
# and uv track `latest`, so `mise upgrade` keeps them current. notebooklm-py is
# pinned to an exact version, which `mise upgrade` will not cross: bump it by
# hand, then verify against the live service (`mise run nblm:auth:check`, plus a
# read-only call), since no CI job exercises the browser-driven CLI.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
