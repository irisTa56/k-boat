# Dependabot version updates. Two ecosystems:
#
# - uv, at the workspace root ("/"): Dependabot reads the root uv.lock, which
#   resolves the whole workspace, so one entry covers every member's runtime deps
#   plus the root dev group — no per-member entry as packages are added.
# - github-actions, at "/": keeps the action versions pinned across the CI
#   workflows (.github/workflows/*.yml) current.
#
# The mise-managed tools are out of Dependabot's scope.
# gitleaks, lychee, rumdl and uv track `latest`, so `mise upgrade` covers them.
# notebooklm-py does not: `mise upgrade` will not cross an exact pin.
# Bump it by hand, and verify against the live service before merging.
# No CI job exercises the browser-driven CLI, so a green pipeline is no signal.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
