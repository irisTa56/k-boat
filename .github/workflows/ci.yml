name: CI

# Mirrors the local `mise run pre-commit` quality gate on every PR (and on pushes
# to main), but without mise: CI needs neither the notebooklm tool nor a browser.
# It runs the same ruff / ty / pytest / rumdl / gitleaks checks — uv for the
# Python gates, official actions for rumdl and gitleaks. Keep the checks here in
# sync with mise.toml's `qa:*` tasks.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The lock is authoritative in CI: never re-resolve or update uv.lock here, so a
  # stale lock fails the run instead of being silently papered over.
  UV_FROZEN: "1"

jobs:
  python-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a full version: setup-uv publishes no floating `v8` major tag.
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Sync the workspace venv
        run: uv sync
      # Per-member, each in its own dir so that package's pyproject config applies
      # (ruff selects, ty root, pytest coverage) — matching mise's `qa:py:<member>`.
      - name: kboat — ruff, ty, pytest
        working-directory: packages/kboat
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run ty check
          uv run pytest
      - name: feed-filter — ruff, ty, pytest
        working-directory: packages/feed-filter
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run ty check
          uv run pytest

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Official rumdl action (Dependabot-tracked), not `uvx rumdl`: it avoids an
      # unpinned PyPI install on every run. The rumdl version defaults to latest,
      # matching mise's `rumdl = "latest"`; it auto-detects .rumdl.toml at the root.
      - uses: rvben/rumdl@v0

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks can scan the PR's commits
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
