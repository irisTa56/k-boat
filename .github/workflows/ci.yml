name: CI

# Mirrors the local `mise run pre-commit` quality gate on every PR (and on pushes
# to main), but without mise: CI needs neither the notebooklm tool nor a browser.
# It runs the same ruff / ty / pytest / coverage-floor / rumdl / gitleaks checks —
# uv for the Python gates, official actions for rumdl and gitleaks. Keep the
# checks here in sync with mise.toml's `qa:*` tasks. Also runs offline link-check
# on every PR (the networked check is a separate, non-blocking, weekly workflow —
# see link-check-weekly.yml) and, on a weekly schedule, the whole workflow again
# so toolchain drift surfaces between PRs.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, independent of any PR, so toolchain drift (a new ruff/ty/uv
    # release, a rumdl or gitleaks action update) surfaces even during a quiet
    # week with no open PRs.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The lock is authoritative in CI: never re-resolve or update uv.lock here, so a
  # stale lock fails the run instead of being silently papered over.
  UV_FROZEN: "1"

jobs:
  python-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a full version: setup-uv publishes no floating `v8` major tag.
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Sync the workspace venv
        run: uv sync
      # Per-member, each in its own dir so that package's pyproject config applies
      # (ruff selects, ty root, pytest coverage) — matching mise's `qa:py:<member>`.
      # Each member's coverage-floor step depends on its own `uv run pytest`
      # step above having just written the `.coverage` data file it reads.
      - name: kboat — ruff, ty, pytest
        working-directory: packages/kboat
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run ty check
          uv run pytest
          uv run coverage json -o coverage.json
          uv run python ../../scripts/coverage_floor.py coverage.json
      - name: feed-filter — ruff, ty, pytest
        working-directory: packages/feed-filter
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run ty check
          uv run pytest
          uv run coverage json -o coverage.json
          uv run python ../../scripts/coverage_floor.py coverage.json

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Official rumdl action (Dependabot-tracked), not `uvx rumdl`: it avoids an
      # unpinned PyPI install on every run. Pinned to an exact tag (matching the
      # setup-uv discipline above), not the floating `v0`; it auto-detects
      # .rumdl.toml at the root.
      - uses: rvben/rumdl@v0.2.43

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks can scan the PR's commits
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  link-check-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Offline-only: catches broken relative links and anchors inside the
      # repo's own markdown without depending on the network, so it is cheap
      # enough to run (and block) on every PR. The full networked check runs
      # separately, non-blocking, in link-check-weekly.yml — offline mode
      # can't verify a remote URL still resolves.
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --no-progress "./**/*.md"
          fail: true
