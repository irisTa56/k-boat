name: CI

# Mirrors the local `mise run pre-commit` quality gate on every PR (and on pushes
# to main), but without mise: CI needs neither the notebooklm tool nor a browser.
# It runs the same ruff / ty / pytest / coverage-floor / rumdl / md-shape /
# shellcheck / shfmt / gitleaks / offline-link-check checks -- uv for the Python
# gates, md-shape among them; official actions for rumdl, gitleaks, and lychee;
# and apt for the shell checks (see the `shell-qa` job below for why). Keep the
# checks here in sync with mise.toml's `qa:**` tasks.
#
# Neither `shell-qa` nor `python-minor-check` is a required check --
# `dependabot-auto-merge.yml`'s PRECONDITION names the ones that are.
# `python-minor-check` is also the one job below with no local `qa:**`
# counterpart, and the only one scoped to `schedule` alone: it fails when uv
# resolves a newer stable CPython minor outside this project than the one
# `requires-python` admits inside it, a fact that does not depend on any given
# PR's diff, so running it there would only repeat the same answer on every
# open PR until the interpreter range moves. Scoping it to the weekly
# schedule instead means the maintainer meets it as the failed-run email that
# schedule already sends, rather than as a merge blocker for a release outside
# this repository's control. `scripts/check_python_minor.sh` says how the
# check works, and the root CLAUDE.md's "Tooling config" section says what to
# do once it fails.
#
# The weekly schedule re-runs this same workflow so a drift in something no PR
# exercises surfaces even during a quiet week with no open PRs. Concretely:
# the `ubuntu-latest` runner image; `actions/checkout@v7` and
# `gitleaks/gitleaks-action@v3`, both floating major-version tags; and the
# `uv` and `rumdl` binaries themselves -- pinning `setup-uv`/`rumdl`'s own
# *action* tag exactly (as done below) does not also pin the tool version
# each installs, since neither step sets that action's `version` input, so
# both resolve to whatever release is current at run time. `uv.lock` keeps
# dependency resolution reproducible regardless (`UV_FROZEN` below).
# `lychee-action@v2.9.0` is the one exception that is genuinely immune: its
# own default `lycheeVersion` is fixed inside that exact tag. GitHub disables
# a `schedule` trigger after 60 days with no repository activity, so this
# canary itself goes quiet on a truly dormant repo -- past the quiet-week
# case it exists to cover, but worth knowing rather than assuming it always runs.
#
# The full networked link check is a separate, non-blocking, weekly workflow --
# see link-check-weekly.yml.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  # `event_name` in the key: without it, the Monday-morning schedule run and a
  # same-moment push to `main` would resolve to the same group (both target
  # `refs/heads/main`) and cancel each other under `cancel-in-progress`.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # The lock is authoritative in CI: never re-resolve or update uv.lock here, so a
  # stale lock fails the run instead of being silently papered over.
  UV_FROZEN: "1"

jobs:
  python-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a full version: setup-uv publishes no floating `v8` major tag.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Sync the workspace venv
        run: uv sync
      # Per-member, each in its own dir so that package's pyproject config applies
      # (ruff selects, ty root, pytest coverage) — matching mise's `qa:py:<member>`.
      # `pytest` itself writes `coverage.json` (`--cov-report=json:...` in each
      # member's `addopts`), so the floor check that follows can read it directly.
      - name: kboat — ruff, ty, pytest, coverage floor
        working-directory: packages/kboat
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run ty check
          uv run pytest
          uv run python ../../scripts/coverage_floor.py coverage.json
      - name: feed-filter — ruff, ty, pytest, coverage floor
        working-directory: packages/feed-filter
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run ty check
          uv run pytest
          uv run python ../../scripts/coverage_floor.py coverage.json
      # No coverage-floor check for this one: `scripts/` is flat tooling, not a
      # workspace member with a `--cov-fail-under` of its own.
      - name: scripts/ tooling — ruff, ty, pytest
        run: |
          uv run ruff check scripts
          uv run ruff format --check scripts
          uv run ty check scripts
          uv run pytest scripts/tests

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Official rumdl action (Dependabot-tracked), not `uvx rumdl`: it avoids an
      # unpinned PyPI install on every run. Pinned to an exact tag, matching the
      # `setup-uv` pin above -- a reproducible action body, with each bump a
      # visible, reviewable diff instead of a silent `@v0` re-resolve. This
      # pins the action's own code, not the `rumdl` binary version it installs
      # (see the header comment). It auto-detects .rumdl.toml at the root.
      - uses: rvben/rumdl@v0.2.68
      # Pinned to the same full version as the `python-qa` job's, for the same
      # reason: setup-uv publishes no floating major tag.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Sync the workspace venv
        run: uv sync
      # The markdown fault rumdl cannot see, mirroring mise's `qa:md`. The
      # script parses with `markdown-it-py` rather than answering CommonMark
      # itself, so it needs the workspace venv the two steps above install --
      # `qa:md` reaches the same script through the same `uv run python`.
      - run: uv run python scripts/md_shape.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks can scan the PR's commits
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  link-check-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Offline-only: catches broken relative links inside the repo's own
      # markdown without depending on the network, so it is cheap enough to run
      # (and block) on every PR -- matching the local `mise run qa:links:offline`
      # task. Shared settings come from `lychee.toml`. The full networked check runs
      # separately, non-blocking, in link-check-weekly.yml.
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --no-progress --config lychee.toml .
          fail: true

  shell-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # shellcheck ships preinstalled on this runner image
      # (https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
      # lists it under "Installed apt packages"); shfmt does not, but Ubuntu
      # noble's `universe` component carries it
      # (https://packages.ubuntu.com/noble/shfmt, 3.8.0-1 there), so a plain
      # apt install covers both without adding a third-party action to pin and
      # watch. (A pip-installable wrapper exists for each too -- `shellcheck-py`,
      # `shfmt-py` -- but apt needs nothing this workflow does not already have.)
      - name: Install shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt
      # Same commands as mise's `qa:sh` task. The version differs: apt's
      # shellcheck/shfmt here can trail what `mise upgrade` tracks locally as
      # `latest`.
      - name: shellcheck, shfmt
        run: |
          shellcheck scripts/*.sh
          shfmt -i 2 -d scripts/*.sh

  python-minor-check:
    runs-on: ubuntu-latest
    # Only on the weekly schedule -- see the header comment.
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7
      # Pinned to the same full version as the `python-qa` job's, for the same
      # reason: setup-uv publishes no floating major tag.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # This job resolves no project dependencies (no `uv sync`), so it has
          # nothing worth caching -- and setup-uv's cache key has no per-job
          # component (architecture / OS / Python version / lockfile hash /
          # optional suffix only), so on a cache miss this job's near-empty
          # save would win the race and get restored by `python-qa` and
          # `markdown-lint` too, replacing their real dependency cache.
          enable-cache: false
          # The newest CPython uv will install is whatever its own release
          # knows about, so this job needs the newest uv release, not merely
          # whatever no-`version`'s config-file lookup would otherwise find --
          # an unrelated future `[tool.uv] required-version` pin (the kind
          # `dependabot-auto-merge.yml`'s header already anticipates for other
          # gate tools) would freeze this check's "latest" answer to that
          # uv's release date, with no error to say so. An explicit `version`
          # skips that lookup, per setup-uv's own README.
          version: "latest"
      - name: Fail if a newer stable CPython minor exists than requires-python admits
        run: scripts/check_python_minor.sh
