name: Link check (weekly)

# The full networked link check, `mise run check:links`. Kept out of ci.yml on
# purpose (mirroring why `check:links` is kept out of `qa:**`) -- it is too slow
# and too flaky on external hosts to gate a PR. Runs weekly instead, and
# non-blocking (`continue-on-error`): a link some third-party site took down
# never fails the run. The report goes to this run's GitHub Actions summary page
# and nowhere else -- no failing status, no email -- so a broken link surfaces
# only to someone who opens the run.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.3.0
        with:
          cache: false # for the reason ci.yml's `python-qa` job gives
      - name: Check every link
        continue-on-error: true
        env:
          # lychee reads this for github.com links, which rate-limit anonymous requests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run check:links -- --format markdown --output "$GITHUB_STEP_SUMMARY"
