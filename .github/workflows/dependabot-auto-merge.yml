name: Dependabot auto-merge

# Enable auto-merge on every Dependabot PR so a green update lands without a
# manual click. The merge waits for the main ruleset's required CI checks, so a
# failing update never merges — that gate is what keeps auto-merging safe at any
# semver level, majors included. No approval step is needed: the ruleset requires
# no review.
#
# One thing that gate does not cover is itself. A tool that IS the gate can narrow
# what CI checks while leaving it green — a linter whose default rule set shrinks
# passes a clean tree either way — so such a tool needs its own version guard rather
# than relying on this one. Ruff has `required-version` in the root pyproject.toml;
# the other gate tools arriving this way carry no equivalent, so for them a green run
# here is the only signal there is.
#
# PRECONDITION: this is only safe once the main ruleset requires every blocking
# CI check (python-qa / markdown-lint / secret-scan / link-check-offline) — that
# requirement is what makes `--auto` wait for CI. Keep the repo's "Allow
# auto-merge" setting OFF until the ruleset covers all of them; with it off,
# `gh pr merge --auto` fails loudly here rather than merging a PR before its
# checks have run.

on: pull_request

# Dependabot PRs run with a read-only token by default; elevate GITHUB_TOKEN here
# so the job can enable auto-merge.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
